[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smog3"
version = "0.1.0a1"
description = "Python-native successor runtime for SMOG2 structure-based model generation"
readme = {file = "README", content-type = "text/plain"}
requires-python = ">=3.9"
authors = [{name = "SMOG development team"}]
license = "GPL-2.0-or-later"
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.urls]
Homepage = "https://smog-server.org/"
Documentation = "https://smog-server.org/smog2/"
Repository = "https://github.com/smog-server/SMOG2"

[project.scripts]
smog3 = "smog3.cli:smog3_main"
smog3-parity-direct = "smog3.cli:smog3_parity_direct_main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
smog3 = ["data/**/*", "data/**/.*"]
